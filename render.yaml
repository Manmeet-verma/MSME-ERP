services:
  - type: web
    name: msme-erp-api
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: cd artifacts/api-server && npm install --legacy-peer-deps && npm run build
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8080
